[package]
name = "pledgr-escrow"
version = "0.3.0"
description = "Pledgr escrow program: builds, bonds, milestone tranches, verdicts and appeals on Solana."
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "pledgr_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
